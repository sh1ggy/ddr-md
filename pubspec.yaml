name: ddr_md
description: "DDR Markdown"
publish_to: 'none'
version: 1.0.1

environment:
  sdk: '>=3.3.0 <4.0.0'
  flutter: ">=3.38.6"

dependencies:
  flutter:
    sdk: flutter
  provider: ^6.1.1
  fl_chart: ^0.66.2
  shared_preferences: ^2.2.3
  sqflite: ^2.3.3+1
  path: ^1.9.0
  uuid: ^4.4.0
  url_launcher: ^6.3.0
  ffi: ^2.1.5
  native_opencv:
    path: native_opencv
  path_provider: ^2.1.5
  image_picker: ^1.2.1
  get: ^4.7.3
  font_awesome_flutter: ^11.0.0
  # Low-latency audio engine (SoLoud). Drives the assist tick so it can be
  # scheduled against the engine's own audio-thread clock instead of the
  # render loop — dense streams need every tick on time, and the old
  # audioplayers backend had no scheduling API. See
  # lib/components/song/notes/tick_clock.dart.
  flutter_soloud: ^4.0.13
  crypto: ^3.0.7
  flutter_inappwebview: ^6.1.5
  html: ^0.15.7
  go_router: ^18.1.0
  share_plus: ^13.3.1
  flutter_secure_storage: ^11.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  sqflite_common_ffi: ^2.4.5

flutter:
  assets:
    - assets/
    - assets/audio/
    - assets/icons/
    - assets/jackets-160/
    - assets/jackets/
    - assets/steps/
    # Generated by tool/generate_patterns.dart (git-ignored).
    - assets/patterns/
    # Sprite noteskin (git-ignored, copyrighted Konami art). Absent by
    # default; the app falls back to a vector skin.
    - assets/noteskin/
    # Difficulty name and level art (git-ignored, copyrighted Konami art).
    # Absent by default; DifficultyLabel falls back to text.
    - assets/difficulty/
    # Only the model triple the app loads at runtime (ocr_onnx.cpp defaults).
    # The other variants in assets/models/ exist for the offline
    # native_opencv/tools/model_compare harness and must not ship in the bundle.
    - assets/models/ppocr_small_det.onnx
    - assets/models/ppocr_small_rec.onnx
    - assets/models/ppocrv6_small_dict.txt
    - assets/templates/
    - fonts/Unbounded-OFL.txt
    - fonts/Inter-OFL.txt
    - fonts/ChakraPetch-OFL.txt
  fonts:
    - family: Handel
      fonts: 
        - asset: fonts/handel_gothic.ttf
    # Floor Pop's faces (lib/theme.dart), static instances under the OFL.
    - family: Unbounded
      fonts:
        - asset: fonts/Unbounded-Bold.ttf
          weight: 700
        - asset: fonts/Unbounded-Black.ttf
          weight: 900
    - family: Inter
      fonts:
        - asset: fonts/Inter-Regular.ttf
        - asset: fonts/Inter-Medium.ttf
          weight: 500
        - asset: fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: fonts/Inter-Bold.ttf
          weight: 700
        - asset: fonts/Inter-ExtraBold.ttf
          weight: 800
        - asset: fonts/Inter-Black.ttf
          weight: 900
        - asset: fonts/Inter-BlackItalic.ttf
          weight: 900
          style: italic
    - family: ChakraPetch
      fonts:
        - asset: fonts/ChakraPetch-SemiBold.ttf
          weight: 600
        - asset: fonts/ChakraPetch-Bold.ttf
          weight: 700
        - asset: fonts/ChakraPetch-SemiBoldItalic.ttf
          weight: 600
          style: italic
        - asset: fonts/ChakraPetch-BoldItalic.ttf
          weight: 700
          style: italic
  uses-material-design: true
